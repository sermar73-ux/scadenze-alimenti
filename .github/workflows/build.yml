name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # il pacchetto 'tools' predefinito non esiste più
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila l'APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Scadenze-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Pubblica l'APK in una Release: si scarica da un link diretto anche dal telefono
      - name: Prepara l'APK per la Release
        run: cp app/build/outputs/apk/debug/app-debug.apk Scadenze.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scadenze alimenti (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Scadenze.apk
